[project]
name = "landora-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abrar Alkathami", email = "121416472+ILABRAR1@users.noreply.github.com" }
]
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "fastapi>=0.128.8",
    "openai>=2.48.0",
    "psycopg>=3.2.13",
    "psycopg-binary>=3.2.13",
    "pydantic-settings>=2.11.0",
    "qdrant-client>=1.16.1",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.39.0",
]

[project.scripts]
landora-backend = "landora_backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.17.0",
]
